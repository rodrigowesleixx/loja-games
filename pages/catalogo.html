<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo — NEXUS</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

  <nav class="navbar">
    <a href="../index.html" class="logo">NEXUS</a>
    <div class="nav-links">
      <a href="../index.html">Início</a>
      <a href="catalogo.html" class="active">Catálogo</a>
      <a href="personas.html">Personas</a>
      <a href="sobre.html">Sobre</a>
    </div>
    <button class="cart-btn" onclick="toggleCart()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      <span class="cart-count" id="cart-count">0</span>
    </button>
  </nav>

  <div class="page-header">
    <h1>Catálogo</h1>
    <p>Todos os jogos disponíveis na loja</p>
  </div>

  <div class="catalog-controls">
    <input type="text" class="search-input" placeholder="Buscar jogo..." id="search-input" oninput="filterGames()">
    <button class="filter-btn active" onclick="setFilter('todos', this)">Todos</button>
    <button class="filter-btn" onclick="setFilter('RPG', this)">RPG</button>
    <button class="filter-btn" onclick="setFilter('Ação', this)">Ação</button>
    <button class="filter-btn" onclick="setFilter('Estratégia', this)">Estratégia</button>
    <button class="filter-btn" onclick="setFilter('Terror', this)">Terror</button>
    <button class="filter-btn" onclick="setFilter('Corrida', this)">Corrida</button>
  </div>

  <div class="catalog-grid" id="catalog-grid"></div>

  <div class="cart-overlay" id="cart-overlay" onclick="toggleCart()"></div>
  <aside class="cart-sidebar" id="cart-sidebar">
    <div class="cart-header">
      <h3>Carrinho</h3>
      <button onclick="toggleCart()" class="close-btn">✕</button>
    </div>
    <div class="cart-items" id="cart-items">
      <p class="empty-cart">Seu carrinho está vazio.</p>
    </div>
    <div class="cart-footer" id="cart-footer" style="display:none">
      <div class="cart-total">
        <span>Total</span>
        <strong id="cart-total">R$ 0,00</strong>
      </div>
      <button class="btn-primary full">Finalizar compra</button>
    </div>
  </aside>

  <div class="toast" id="toast"></div>

  <footer class="footer">
    <p>© 2025 NEXUS Game Store.</p>
  </footer>

  <script src="../js/data.js"></script>
  <script src="../js/cart.js"></script>
  <script>
    let activeFilter = 'todos';

    function createGameCard(game) {
      const badgeHTML = game.badge
        ? `<span class="game-badge ${game.badge}">${game.badge === 'new' ? 'Novo' : 'Oferta'}</span>`
        : '';
      return `
        <div class="game-card">
          <div class="game-thumb">${game.emoji}${badgeHTML}</div>
          <div class="game-info">
            <div class="game-name">${game.name}</div>
            <div class="game-genre">${game.genre}</div>
            <div class="game-footer">
              <span class="game-price">R$ ${game.price.toFixed(2).replace('.', ',')}</span>
              <button class="game-add" onclick="addToCart('${game.name}', ${game.price})">+</button>
            </div>
          </div>
        </div>
      `;
    }

    function filterGames() {
      const search = document.getElementById('search-input').value.toLowerCase();
      const grid = document.getElementById('catalog-grid');
      let games = GAMES;

      if (activeFilter !== 'todos') {
        games = games.filter(g => g.genre.toLowerCase().includes(activeFilter.toLowerCase()));
      }

      if (search) {
        games = games.filter(g => g.name.toLowerCase().includes(search) || g.genre.toLowerCase().includes(search));
      }

      grid.innerHTML = games.length > 0
        ? games.map(createGameCard).join('')
        : '<p style="color:var(--muted);padding:20px;">Nenhum jogo encontrado.</p>';
    }

    function setFilter(filter, btn) {
      activeFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterGames();
    }

    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const cat = params.get('categoria');
      if (cat) {
        activeFilter = cat;
        document.querySelectorAll('.filter-btn').forEach(b => {
          if (b.textContent === cat) b.classList.add('active');
          else b.classList.remove('active');
        });
      }
      filterGames();
    });
  </script>
</body>
</html>
