<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produto — NEXUS</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    .product-page { padding: 100px 40px 60px; display: grid; grid-template-columns: 320px 1fr; gap: 60px; max-width: 1100px; }
    .product-cover { width: 100%; aspect-ratio: 3/4; border-radius: 16px; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 100px; position: relative; overflow: hidden; }
    .product-cover.c1 { background: linear-gradient(135deg, #0f0020 0%, #1a0535 40%, #001020 100%); }
    .product-cover.c2 { background: linear-gradient(135deg, #1a0a00 0%, #2a1500 40%, #0a0010 100%); }
    .product-cover.c3 { background: linear-gradient(135deg, #001020 0%, #001530 40%, #000a15 100%); }
    .product-cover-badge { position: absolute; top: 16px; left: 16px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; padding: 4px 10px; border-radius: 6px; }
    .product-cover-badge.new { background: var(--accent); color: #000; }
    .product-cover-badge.sale { background: #ff4747; color: #fff; }
    .product-info { padding-top: 8px; }
    .product-genre { font-size: 12px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin-bottom: 12px; }
    .product-title { font-family: var(--font-display); font-size: 42px; font-weight: 800; letter-spacing: -0.02em; line-height: 1; margin-bottom: 16px; }
    .product-meta { display: flex; gap: 20px; margin-bottom: 28px; }
    .product-meta-item { display: flex; flex-direction: column; gap: 4px; }
    .product-meta-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
    .product-meta-value { font-size: 14px; font-weight: 500; }
    .product-rating { color: var(--accent); }
    .product-desc { font-size: 15px; color: rgba(240,240,240,0.7); line-height: 1.8; margin-bottom: 32px; border-left: 2px solid var(--border); padding-left: 16px; }
    .product-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 32px; }
    .product-tag { font-size: 12px; padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border); color: var(--muted); }
    .product-price-row { display: flex; align-items: center; gap: 24px; margin-bottom: 24px; }
    .product-price { font-family: var(--font-display); font-size: 40px; font-weight: 800; color: var(--accent); }
    .product-price-old { font-size: 18px; color: var(--muted); text-decoration: line-through; }
    .product-actions { display: flex; gap: 12px; }
    .product-actions .btn-primary { padding: 14px 32px; font-size: 15px; }
    .product-divider { border: none; border-top: 1px solid var(--border); margin: 40px 0; }
    .product-specs { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .spec-item { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
    .spec-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 6px; }
    .spec-value { font-size: 14px; font-weight: 500; }
    .related-section { padding: 0 40px 60px; }
    .related-section h2 { font-family: var(--font-display); font-size: 24px; font-weight: 700; margin-bottom: 24px; }
    @media (max-width: 768px) {
      .product-page { grid-template-columns: 1fr; padding: 100px 20px 40px; gap: 32px; }
      .product-cover { max-width: 280px; margin: 0 auto; }
      .product-title { font-size: 32px; }
      .product-specs { grid-template-columns: 1fr; }
      .related-section { padding: 0 20px 60px; }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="../index.html" class="logo">NEXUS</a>
    <div class="nav-links">
      <a href="../index.html">Início</a>
      <a href="catalogo.html">Catálogo</a>
      <a href="personas.html">Personas</a>
      <a href="sobre.html">Sobre</a>
    </div>
    <button class="cart-btn" onclick="toggleCart()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      <span class="cart-count" id="cart-count">0</span>
    </button>
  </nav>

  <div class="product-page" id="product-content">
    <!-- preenchido via JS -->
  </div>

  <div class="related-section">
    <h2>Você também pode gostar</h2>
    <div class="games-grid" id="related-grid"></div>
  </div>

  <div class="cart-overlay" id="cart-overlay" onclick="toggleCart()"></div>
  <aside class="cart-sidebar" id="cart-sidebar">
    <div class="cart-header">
      <h3>Carrinho</h3>
      <button onclick="toggleCart()" class="close-btn">✕</button>
    </div>
    <div class="cart-items" id="cart-items"><p class="empty-cart">Seu carrinho está vazio.</p></div>
    <div class="cart-footer" id="cart-footer" style="display:none">
      <div class="cart-total"><span>Total</span><strong id="cart-total">R$ 0,00</strong></div>
      <button class="btn-primary full" onclick="window.location.href='checkout.html'">Finalizar compra</button>
    </div>
  </aside>

  <div class="toast" id="toast"></div>

  <footer class="footer">
    <p>© 2026 NEXUS Game Store. Feito e desenvolvido por N7. Todos os direitos reservados.</p>
  </footer>

  <script src="../js/covers.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/cart.js"></script>
  <script>
    const covers = ['c1','c2','c3'];
    const descs = {
      1: "Explore Night City, uma megalópole obcecada por poder, glamour e modificações corporais. Você é V, um mercenário em busca de um implante único que é a chave para a imortalidade.",
      2: "Um vasto mundo entre sonhos, habitado por monstros de aspecto distorcido. Aventure-se por terras impregnadas de mistério e perigo, e enfrente outros Infectados pela Graça.",
      3: "A mais ambiciosa sequência da Rockstar. Explore um mundo vivo e detalhado com histórias interligadas e liberdade total.",
      4: "Uma épica saga western de lealdade e sobrevivência no alvorecer da era moderna. Experimente a vida de Arthur Morgan no fim do Velho Oeste.",
      5: "O maior RPG de fantasia já criado. Uma aventura épica pelo continente de Nilfgaard com escolhas que mudam o destino do mundo.",
      6: "Escape do submundo grego com a ajuda dos deuses do Olimpo. Um roguelike frenético com combate fluido e história rica.",
      7: "Uma aventura épica de plataforma e exploração num vasto mundo subterrâneo cheio de segredos, desafios e uma história envolvente.",
      8: "O RPG de turno mais celebrado da geração. Três atos, centenas de horas de conteúdo e escolhas que realmente importam.",
      9: "Um desafio brutal de arte marcial no Japão feudal. Maestria, paciência e precisão são a chave para sobreviver.",
      10: "O remake definitivo do clássico survival horror. Atmosfera sufocante, ação intensa e terror psicológico numa nave espacial morta.",
      11: "Explore um universo sem limites com centenas de planetas para descobrir, bases para construir e facções para interagir.",
      12: "A experiência de corrida mais completa. Mais de 500 carros, mundo aberto enorme e gráficos deslumbrantes no México.",
    };

    function renderProduct() {
      const params = new URLSearchParams(window.location.search);
      const id = parseInt(params.get('id')) || 1;
      const game = GAMES.find(g => g.id === id) || GAMES[0];
      const coverClass = covers[(id - 1) % covers.length];
      const badgeHTML = game.badge
        ? `<span class="product-cover-badge ${game.badge}">${game.badge === 'new' ? 'Novo' : 'Oferta'}</span>`
        : '';
      const oldPrice = game.badge === 'sale'
        ? `<span class="product-price-old">R$ ${(game.price * 1.3).toFixed(2).replace('.', ',')}</span>`
        : '';
      const desc = descs[game.id] || 'Uma experiência incrível esperando por você.';
      const tags = game.genre.split('·').map(t => `<span class="product-tag">${t.trim()}</span>`).join('');

      document.getElementById('product-content').innerHTML = `
        <div>
          <div class="product-cover ${coverClass}">
            <img src="${game.cover}" alt="${game.name}" style="width:100%;height:100%;object-fit:cover;display:block;border-radius:16px" onerror="this.style.display='none'">
            ${badgeHTML}
          </div>
        </div>
        <div class="product-info">
          <div class="product-genre">${game.genre}</div>
          <h1 class="product-title">${game.name}</h1>
          <div class="product-meta">
            <div class="product-meta-item">
              <span class="product-meta-label">Avaliação</span>
              <span class="product-meta-value product-rating">★ ${game.rating}</span>
            </div>
            <div class="product-meta-item">
              <span class="product-meta-label">Plataforma</span>
              <span class="product-meta-value">PC / Console</span>
            </div>
            <div class="product-meta-item">
              <span class="product-meta-label">Idioma</span>
              <span class="product-meta-value">Português</span>
            </div>
          </div>
          <p class="product-desc">${desc}</p>
          <div class="product-tags">${tags}</div>
          <div class="product-price-row">
            <span class="product-price">R$ ${game.price.toFixed(2).replace('.', ',')}</span>
            ${oldPrice}
          </div>
          <div class="product-actions">
            <button class="btn-primary" onclick="addToCart('${game.name}', ${game.price})">Adicionar ao carrinho</button>
            <button class="btn-ghost" onclick="addToCart('${game.name}', ${game.price}); window.location.href='checkout.html'">Comprar agora</button>
          </div>
          <hr class="product-divider">
          <div class="product-specs">
            <div class="spec-item"><div class="spec-label">Desenvolvedor</div><div class="spec-value">Estúdio Independente</div></div>
            <div class="spec-item"><div class="spec-label">Lançamento</div><div class="spec-value">2024</div></div>
            <div class="spec-item"><div class="spec-label">Tamanho</div><div class="spec-value">~70 GB</div></div>
            <div class="spec-item"><div class="spec-label">Entrega</div><div class="spec-value">Digital imediata</div></div>
          </div>
        </div>
      `;

      document.title = `${game.name} — NEXUS`;

      const related = GAMES.filter(g => g.id !== game.id && g.genre.split('·')[0].trim() === game.genre.split('·')[0].trim()).slice(0, 4);
      const fallback = GAMES.filter(g => g.id !== game.id).slice(0, 4);
      const relatedGames = related.length >= 2 ? related : fallback;

      document.getElementById('related-grid').innerHTML = relatedGames.map(g => `
        <div class="game-card" onclick="window.location.href='produto.html?id=${g.id}'">
          <div class="game-thumb"><img src="${g.cover}" alt="${g.name}" style="width:100%;height:100%;object-fit:cover" onerror="this.style.display='none'">${g.badge ? `<span class="game-badge ${g.badge}">${g.badge === 'new' ? 'Novo' : 'Oferta'}</span>` : ''}</div>
          <div class="game-info">
            <div class="game-name">${g.name}</div>
            <div class="game-genre">${g.genre}</div>
            <div class="game-footer">
              <span class="game-price">R$ ${g.price.toFixed(2).replace('.', ',')}</span>
              <button class="game-add" onclick="event.stopPropagation(); addToCart('${g.name}', ${g.price})">+</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    document.addEventListener('DOMContentLoaded', renderProduct);
  </script>
</body>
</html>
