<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS — Login</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="../index.html" class="logo">NEXUS</a>
    <div class="nav-links">
      <a href="../index.html">Início</a>
      <a href="catalogo.html">Catálogo</a>
      <a href="personas.html">Personas</a>
      <a href="sobre.html">Sobre</a>
    </div>
    <div class="nav-right">
      <a href="login.html" id="nav-login-btn" class="login-nav-btn active">Entrar</a>
      <div id="nav-user-menu" class="nav-user-menu" style="display:none">
        <span id="nav-username" class="nav-username"></span>
        <button class="logout-btn" onclick="logout()">Sair</button>
      </div>
    </div>
  </nav>

  <!-- LOGIN PAGE -->
  <div class="login-page">
    <!-- Left: branding -->
    <div class="login-branding">
      <div class="login-branding-inner">
        <div class="login-logo">NEXUS</div>
        <h2 class="login-tagline">Seu universo<br>de games<br><span>em um só lugar.</span></h2>
        <div class="login-games-preview">
          <div class="preview-card" style="--delay:0s"><img src="https://cdn.cloudflare.steamstatic.com/steam/apps/1245620/library_600x900.jpg" alt="Elden Ring"></div>
          <div class="preview-card" style="--delay:0.15s"><img src="https://cdn.cloudflare.steamstatic.com/steam/apps/1086940/library_600x900.jpg" alt="BG3"></div>
          <div class="preview-card" style="--delay:0.3s"><img src="https://cdn.cloudflare.steamstatic.com/steam/apps/1091500/library_600x900.jpg" alt="Cyberpunk"></div>
        </div>
      </div>
    </div>

    <!-- Right: form -->
    <div class="login-form-area">
      <div class="login-box">
        <div class="login-tabs">
          <button class="login-tab active" id="tab-login" onclick="switchTab('login')">Entrar</button>
          <button class="login-tab" id="tab-register" onclick="switchTab('register')">Criar conta</button>
        </div>

        <!-- LOGIN FORM -->
        <div id="form-login" class="auth-form">
          <div class="form-group">
            <label>E-mail</label>
            <input type="email" id="login-email" class="form-input" placeholder="seu@email.com" autocomplete="email">
          </div>
          <div class="form-group">
            <label>Senha</label>
            <input type="password" id="login-password" class="form-input" placeholder="••••••••" autocomplete="current-password">
          </div>
          <div class="form-options">
            <label class="checkbox-label">
              <input type="checkbox" id="remember-me"> Lembrar de mim
            </label>
            <a href="#" class="forgot-link">Esqueceu a senha?</a>
          </div>
          <div id="login-error" class="form-error" style="display:none"></div>
          <button class="btn-primary full" onclick="handleLogin()">Entrar na conta</button>
          <div class="form-divider"><span>ou continue com</span></div>
          <div class="social-btns">
            <button class="social-btn" onclick="handleSocialLogin('Google')">
              <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
              Google
            </button>
            <button class="social-btn" onclick="handleSocialLogin('Steam')">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M11.979 0C5.678 0 .511 4.86.022 11.037l6.432 2.658c.545-.371 1.203-.59 1.912-.59.063 0 .125.004.188.006l2.861-4.142V8.91c0-2.495 2.028-4.524 4.524-4.524 2.494 0 4.524 2.029 4.524 4.524s-2.03 4.524-4.524 4.524h-.105l-4.076 2.911c0 .052.004.105.004.159 0 1.875-1.515 3.396-3.39 3.396-1.635 0-3.016-1.173-3.331-2.727L.436 15.27C1.862 20.307 6.486 24 11.979 24c6.627 0 11.999-5.373 11.999-12S18.606 0 11.979 0zM7.54 18.21l-1.473-.61c.262.543.714.999 1.314 1.25 1.297.539 2.793-.076 3.332-1.375.263-.63.264-1.319.005-1.949s-.75-1.121-1.377-1.383c-.624-.26-1.29-.249-1.878-.03l1.523.63c.956.4 1.409 1.5 1.009 2.455-.397.957-1.497 1.41-2.455 1.012H7.54zm11.415-9.303c0-1.662-1.353-3.015-3.015-3.015-1.665 0-3.015 1.353-3.015 3.015 0 1.665 1.35 3.015 3.015 3.015 1.663 0 3.015-1.35 3.015-3.015zm-5.273-.005c0-1.252 1.013-2.266 2.265-2.266 1.249 0 2.266 1.014 2.266 2.266 0 1.251-1.017 2.265-2.266 2.265-1.252 0-2.265-1.014-2.265-2.265z"/></svg>
              Steam
            </button>
          </div>
        </div>

        <!-- REGISTER FORM -->
        <div id="form-register" class="auth-form" style="display:none">
          <div class="form-group">
            <label>Nome completo</label>
            <input type="text" id="reg-name" class="form-input" placeholder="Seu nome">
          </div>
          <div class="form-group">
            <label>E-mail</label>
            <input type="email" id="reg-email" class="form-input" placeholder="seu@email.com">
          </div>
          <div class="form-group">
            <label>Senha</label>
            <input type="password" id="reg-password" class="form-input" placeholder="Mínimo 6 caracteres">
          </div>
          <div id="reg-error" class="form-error" style="display:none"></div>
          <button class="btn-primary full" onclick="handleRegister()">Criar conta grátis</button>
          <p class="terms-text">Ao criar uma conta, você concorda com nossos <a href="#">Termos de Uso</a>.</p>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/covers.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/app.js"></script>
  <script>
    function switchTab(tab) {
      document.getElementById('tab-login').classList.toggle('active', tab === 'login');
      document.getElementById('tab-register').classList.toggle('active', tab === 'register');
      document.getElementById('form-login').style.display = tab === 'login' ? 'block' : 'none';
      document.getElementById('form-register').style.display = tab === 'register' ? 'block' : 'none';
    }

    function handleLogin() {
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const errEl = document.getElementById('login-error');

      if (!email || !password) {
        showFormError(errEl, 'Preencha todos os campos.');
        return;
      }

      // Check registered users
      const users = JSON.parse(localStorage.getItem('nexus_users') || '[]');
      const user = users.find(u => u.email === email && u.password === password);

      if (!user) {
        showFormError(errEl, 'E-mail ou senha incorretos.');
        return;
      }

      localStorage.setItem('nexus_user', JSON.stringify({ name: user.name, email: user.email }));
      window.location.href = '../index.html';
    }

    function handleRegister() {
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      const errEl = document.getElementById('reg-error');

      if (!name || !email || !password) {
        showFormError(errEl, 'Preencha todos os campos.');
        return;
      }
      if (password.length < 6) {
        showFormError(errEl, 'A senha precisa ter ao menos 6 caracteres.');
        return;
      }

      const users = JSON.parse(localStorage.getItem('nexus_users') || '[]');
      if (users.find(u => u.email === email)) {
        showFormError(errEl, 'Este e-mail já está cadastrado.');
        return;
      }

      users.push({ name, email, password });
      localStorage.setItem('nexus_users', JSON.stringify(users));
      localStorage.setItem('nexus_user', JSON.stringify({ name, email }));
      window.location.href = '../index.html';
    }

    function handleSocialLogin(provider) {
      const fakeName = provider === 'Google' ? 'Gamer Google' : 'Steam Player';
      const fakeEmail = `usuario@${provider.toLowerCase()}.com`;
      localStorage.setItem('nexus_user', JSON.stringify({ name: fakeName, email: fakeEmail }));
      window.location.href = '../index.html';
    }

    function showFormError(el, msg) {
      el.textContent = msg;
      el.style.display = 'block';
      setTimeout(() => el.style.display = 'none', 3500);
    }

    // Redirect if already logged in
    if (getUser()) window.location.href = '../index.html';
  </script>
</body>
</html>
