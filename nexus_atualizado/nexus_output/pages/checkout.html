<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — NEXUS</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    .checkout-page { padding: 100px 40px 60px; display: grid; grid-template-columns: 1fr 380px; gap: 48px; max-width: 1100px; }
    .checkout-title { font-family: var(--font-display); font-size: 32px; font-weight: 800; margin-bottom: 32px; letter-spacing: -0.02em; }
    .form-section { margin-bottom: 32px; }
    .form-section-title { font-size: 13px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
    .form-row.full { grid-template-columns: 1fr; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: 0.04em; }
    .form-group input, .form-group select {
      background: var(--bg2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 11px 14px;
      border-radius: 8px;
      font-family: var(--font-body);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
      appearance: none;
    }
    .form-group input:focus, .form-group select:focus { border-color: rgba(255,255,255,0.25); }
    .form-group input::placeholder { color: var(--muted); }
    .payment-methods { display: flex; gap: 10px; margin-bottom: 20px; }
    .payment-method { flex: 1; background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 12px; text-align: center; cursor: pointer; font-size: 13px; color: var(--muted); transition: all 0.2s; }
    .payment-method.active { border-color: var(--accent); color: var(--accent); }
    .payment-method input { display: none; }
    .order-summary { background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; padding: 24px; position: sticky; top: 84px; height: fit-content; }
    .order-summary-title { font-family: var(--font-display); font-size: 18px; font-weight: 700; margin-bottom: 20px; }
    .order-items { display: flex; flex-direction: column; gap: 14px; margin-bottom: 24px; max-height: 240px; overflow-y: auto; }
    .order-item { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 14px; }
    .order-item-name { color: rgba(240,240,240,0.8); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .order-item-price { color: var(--accent); font-weight: 500; flex-shrink: 0; }
    .order-divider { border: none; border-top: 1px solid var(--border); margin: 0 0 16px; }
    .order-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 10px; color: var(--muted); }
    .order-total-row { display: flex; justify-content: space-between; font-size: 16px; font-weight: 500; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); color: var(--text); }
    .order-total-price { font-family: var(--font-display); font-size: 24px; font-weight: 800; color: var(--accent); }
    .empty-checkout { text-align: center; padding: 60px 40px; color: var(--muted); }
    .empty-checkout h2 { font-family: var(--font-display); font-size: 24px; font-weight: 700; margin-bottom: 12px; color: var(--text); }
    @media (max-width: 768px) {
      .checkout-page { grid-template-columns: 1fr; padding: 100px 20px 40px; }
      .form-row { grid-template-columns: 1fr; }
      .order-summary { position: static; }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="../index.html" class="logo">NEXUS</a>
    <div class="nav-links">
      <a href="../index.html">Início</a>
      <a href="catalogo.html">Catálogo</a>
      <a href="personas.html">Personas</a>
      <a href="sobre.html">Sobre</a>
    </div>
    <button class="cart-btn" onclick="toggleCart()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      <span class="cart-count" id="cart-count">0</span>
    </button>
  </nav>

  <div id="checkout-wrapper"></div>

  <div class="cart-overlay" id="cart-overlay" onclick="toggleCart()"></div>
  <aside class="cart-sidebar" id="cart-sidebar">
    <div class="cart-header">
      <h3>Carrinho</h3>
      <button onclick="toggleCart()" class="close-btn">✕</button>
    </div>
    <div class="cart-items" id="cart-items"><p class="empty-cart">Seu carrinho está vazio.</p></div>
    <div class="cart-footer" id="cart-footer" style="display:none">
      <div class="cart-total"><span>Total</span><strong id="cart-total">R$ 0,00</strong></div>
      <button class="btn-primary full" onclick="window.location.href='checkout.html'">Finalizar compra</button>
    </div>
  </aside>

  <div class="toast" id="toast"></div>

  <footer class="footer"><p>© 2026 NEXUS Game Store. Feito e desenvolvido por N7. Todos os direitos reservados.</p></footer>

  <script src="../js/data.js"></script>
  <script src="../js/cart.js"></script>
  <script>
    function setPayment(method) {
      document.querySelectorAll('.payment-method').forEach(m => m.classList.remove('active'));
      document.getElementById('pm-' + method).classList.add('active');
      const cardFields = document.getElementById('card-fields');
      const pixField = document.getElementById('pix-field');
      if (cardFields) cardFields.style.display = method === 'cartao' ? 'block' : 'none';
      if (pixField) pixField.style.display = method === 'pix' ? 'block' : 'none';
    }

    function submitOrder() {
      const name = document.getElementById('nome')?.value.trim();
      const email = document.getElementById('email')?.value.trim();
      if (!name || !email) { showToast('Preencha nome e e-mail!'); return; }
      localStorage.removeItem('nexus-cart');
      window.location.href = 'confirmacao.html';
    }

    function renderCheckout() {
      const wrapper = document.getElementById('checkout-wrapper');
      if (cart.length === 0) {
        wrapper.innerHTML = `
          <div class="empty-checkout">
            <h2>Carrinho vazio</h2>
            <p>Adicione jogos ao carrinho antes de finalizar a compra.</p>
            <br>
            <a href="catalogo.html" class="btn-primary" style="display:inline-block;text-decoration:none;margin-top:12px">Ver catálogo</a>
          </div>`;
        return;
      }

      const subtotal = cart.reduce((s, i) => s + i.price, 0);
      const taxa = 0;
      const total = subtotal + taxa;

      const itemsHTML = cart.map(i => `
        <div class="order-item">
          <span class="order-item-name">${i.name}</span>
          <span class="order-item-price">R$ ${i.price.toFixed(2).replace('.', ',')}</span>
        </div>
      `).join('');

      wrapper.innerHTML = `
        <div class="checkout-page">
          <div>
            <h1 class="checkout-title">Finalizar compra</h1>
            <div class="form-section">
              <div class="form-section-title">Dados pessoais</div>
              <div class="form-row">
                <div class="form-group"><label>Nome completo</label><input type="text" id="nome" placeholder="Seu nome"></div>
                <div class="form-group"><label>E-mail</label><input type="email" id="email" placeholder="seu@email.com"></div>
              </div>
              <div class="form-row full">
                <div class="form-group"><label>CPF</label><input type="text" placeholder="000.000.000-00"></div>
              </div>
            </div>
            <div class="form-section">
              <div class="form-section-title">Pagamento</div>
              <div class="payment-methods">
                <label class="payment-method active" id="pm-cartao" onclick="setPayment('cartao')">💳 Cartão</label>
                <label class="payment-method" id="pm-pix" onclick="setPayment('pix')">⚡ PIX</label>
                <label class="payment-method" id="pm-boleto" onclick="setPayment('boleto')">📄 Boleto</label>
              </div>
              <div id="card-fields">
                <div class="form-row full"><div class="form-group"><label>Número do cartão</label><input type="text" placeholder="0000 0000 0000 0000"></div></div>
                <div class="form-row">
                  <div class="form-group"><label>Validade</label><input type="text" placeholder="MM/AA"></div>
                  <div class="form-group"><label>CVV</label><input type="text" placeholder="123"></div>
                </div>
                <div class="form-row full"><div class="form-group"><label>Nome no cartão</label><input type="text" placeholder="Como aparece no cartão"></div></div>
              </div>
              <div id="pix-field" style="display:none; background:var(--bg3); border:1px solid var(--border); border-radius:10px; padding:20px; text-align:center;">
                <p style="color:var(--muted);font-size:14px;margin-bottom:8px">Após confirmar, você receberá o QR Code PIX por e-mail.</p>
                <p style="color:var(--accent);font-size:13px;">⚡ Aprovação imediata</p>
              </div>
            </div>
            <button class="btn-primary" style="padding:14px 40px;font-size:15px" onclick="submitOrder()">Confirmar pedido</button>
          </div>
          <div>
            <div class="order-summary">
              <div class="order-summary-title">Resumo do pedido</div>
              <div class="order-items">${itemsHTML}</div>
              <hr class="order-divider">
              <div class="order-row"><span>Subtotal</span><span>R$ ${subtotal.toFixed(2).replace('.', ',')}</span></div>
              <div class="order-row"><span>Taxa</span><span style="color:var(--accent)">Grátis</span></div>
              <div class="order-total-row"><span>Total</span><span class="order-total-price">R$ ${total.toFixed(2).replace('.', ',')}</span></div>
            </div>
          </div>
        </div>`;
    }

    document.addEventListener('DOMContentLoaded', renderCheckout);
  </script>
</body>
</html>
